name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Build needs valid env in CI; supply minimal defaults so SSG doesn't fail.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_BASE_URL: https://finanzteam26.de
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/sterbegeld24plus
            http://localhost:3000/sterbegeld24plus/vergleichsrechner
            http://localhost:3000/redaktion/christian-wimmer
            http://localhost:3000/marktdaten
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./lighthouserc.json
